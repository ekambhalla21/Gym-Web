<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Membership</title>
<link rel="stylesheet"href="style2.css">
</head>

<body>

    <div class="membership-container">

        <!-- Header -->
        <div class="header">

            <div class="logo">🏋</div>

            <h1>Gym Membership</h1>

            <p>
                Join us and start your fitness journey today!
            </p>

        </div>


        <form action="submit.php" method="POST">

            <!-- Personal Information -->
            <div class="section">

                <div class="section-title">
                    <span class="section-icon">👤</span>
                    Personal Information
                </div>


                <div class="row">

                    <div class="form-group">
                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter first name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter last name"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="row">

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="dob">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >
                        <option value="">
                            Select
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="other">
                            Other
                        </option>
                    </select>

                </div>

            </div>


            <!-- Membership -->
            <div class="section">

                <div class="section-title">

                    <span class="section-icon">
                        💳
                    </span>

                    Membership & Preferences

                </div>


                <div class="form-group">

                    <label for="membership">
                        Membership Plan
                    </label>

                    <select
                        id="membership"
                        name="membership"
                        required
                    >

                        <option value="">
                            Choose a plan
                        </option>

                        <option value="monthly">
                            Monthly - ₹999
                        </option>

                        <option value="quarterly">
                            3 Months - ₹2,499
                        </option>

                        <option value="half-yearly">
                            6 Months - ₹4,499
                        </option>

                        <option value="yearly">
                            1 Year - ₹7,999
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Preferred Workout Time
                    </label>

                    <div class="radio-group">

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="workoutTime"
                                value="morning"
                            >

                            Morning

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="workoutTime"
                                value="afternoon"
                            >

                            Afternoon

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="workoutTime"
                                value="evening"
                            >

                            Evening

                        </label>

                    </div>

                </div>

            </div>


            <!-- Fitness Goals -->
            <div class="section">

                <div class="section-title">

                    <span class="section-icon">
                        ⚙
                    </span>

                    Fitness Goals

                </div>


                <div class="row">

                    <div class="form-group">

                        <label for="goal">
                            Fitness Goal
                        </label>

                        <select
                            id="goal"
                            name="goal"
                            required
                        >

                            <option value="">
                                Select your goal
                            </option>

                            <option value="weight-loss">
                                Weight Loss
                            </option>

                            <option value="muscle-gain">
                                Muscle Gain
                            </option>

                            <option value="strength">
                                Strength Training
                            </option>

                            <option value="fitness">
                                General Fitness
                            </option>

                            <option value="bodybuilding">
                                Bodybuilding
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="experience">
                            Fitness Experience
                        </label>

                        <select
                            id="experience"
                            name="experience"
                        >

                            <option value="">
                                Select experience
                            </option>

                            <option value="beginner">
                                Beginner
                            </option>

                            <option value="intermediate">
                                Intermediate
                            </option>

                            <option value="advanced">
                                Advanced
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="message">
                        Additional Information
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell us anything we should know..."
                    ></textarea>

                </div>

            </div>


            <!-- Terms -->
            <div class="section">

                <div class="section-title">

                    <span class="section-icon">
                        🛡
                    </span>

                    Terms & Conditions

                </div>


                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the gym membership
                        terms and conditions.
                    </label>

                </div>

            </div>


            <!-- Join Button -->
            <button
                type="submit"
                class="join-button"
            >

                Join Now

                <span class="arrow">
                    →
                </span>

            </button>

        </form>

    </div>

</body>
</html>
